<!doctype html><html><head><meta charset="utf-8"><title>Depth setup</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 700px at 30% 10%,#0e3a47,#06141c 60%);color:#e8f1f2;font:16px/1.5 -apple-system,"SF Pro Text",sans-serif}
.card{width:min(520px,92vw);padding:34px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid rgba(127,230,216,.22);box-shadow:0 30px 80px rgba(0,0,0,.45)}
h1{font:600 34px/1.1 ui-serif,"New York",Georgia,serif;margin:0 0 8px}
p{color:#9db6ba;margin:0 0 22px}
button{background:#4de3d1;color:#04222a;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px;cursor:pointer}
#o{margin-top:18px;color:#bff5ee;min-height:24px}
.orb{width:54px;height:54px;border-radius:50%;margin-bottom:18px;background:radial-gradient(circle at 35% 32%,#e6fffb,#35c9b5 55%,#0b5864);box-shadow:0 0 40px #35c9b5aa}
</style></head><body><div class="card"><div class="orb"></div><h1>Let Depth see and hear</h1>
<p>Chrome asks once for camera and microphone. Camera frames go only to your own Gemini chat. Mic powers voice replies. You can pause both in the side panel any time.</p>
<button id="b">Allow camera + microphone</button><div id="o"></div></div><script src="setup.js"></script></body></html>
