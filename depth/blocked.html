<!doctype html><html><head><meta charset="utf-8"><title>Blocked by Depth</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1400px 800px at 70% 0%,#0f3b49,#05121a 65%);color:#e8f1f2;font:16px/1.5 -apple-system,"SF Pro Text",sans-serif}
.w{width:min(620px,92vw)}
h1{font:600 46px/1.05 ui-serif,"New York",Georgia,serif;margin:0 0 12px;letter-spacing:-.01em}
.sub{color:#9db6ba;margin:0 0 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
a.b,button{background:#4de3d1;color:#04222a;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.box{padding:18px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
textarea{width:100%;min-height:70px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px;font:inherit;resize:vertical;margin:10px 0}
.ghost{background:transparent;color:#bff5ee;border:1px solid rgba(127,230,216,.35)}
.hold{position:relative;overflow:hidden;background:transparent;color:#ffb3bb;border:1px solid rgba(255,107,122,.4)}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,107,122,.35)}
.hold span{position:relative}
small{color:#7f979b;display:block;margin-top:8px}
</style></head><body><div class="w">
<h1>You asked me to hold this.</h1>
<p class="sub" id="s">Study mode is on.</p>
<div class="row" id="back"></div>
<div class="box"><b>Need out?</b> Tell Depth why. It will talk it through with you.
<textarea id="r" placeholder="e.g. I need to check a message for work"></textarea>
<button class="ghost" id="ask">Ask Depth to unblock</button>
<button class="hold" id="hold"><i></i><span>Hold 10 seconds to override</span></button>
<small id="u"></small></div></div><script src="blocked.js"></script></body></html>
